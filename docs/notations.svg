<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>One notes spec, three command-line notations</title>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .spec { fill: #ddf4ff; stroke: #0969da; }
    .md { fill: #fff8c5; stroke: #bf8700; }
    .rs { fill: #ffebe9; stroke: #cf222e; }
    .ext { fill: #dafbe1; stroke: #1a7f37; }
    .t { fill: #1f2328; font-size: 13px; text-anchor: middle; }
    .s { fill: #59636e; font-size: 11px; text-anchor: middle; }
    .h { fill: #1f2328; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .hc { fill: #1f2328; font-size: 13px; font-weight: 600; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tc { fill: #1f2328; font-size: 13px; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lm { fill: #59636e; font-size: 11px; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lc { fill: #59636e; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .edge { stroke: #59636e; stroke-width: 1.4; fill: none; }
    .head { fill: #59636e; }
    .lbl { fill: #59636e; font-size: 11px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .spec { fill: #0c2d6b; stroke: #4493f8; }
      .md { fill: #3b2e0a; stroke: #d29922; }
      .rs { fill: #4a1418; stroke: #f85149; }
      .ext { fill: #0f3a1e; stroke: #3fb950; }
      .t, .h, .hc, .tc { fill: #e6edf3; }
      .s, .lbl, .lc, .lm { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="560" rx="8"/>

  <!-- The meaning -->
  <rect class="spec" stroke="#0969da" x="250" y="20" width="260" height="52" rx="8"/>
  <text class="hc" x="380" y="42">notes · notes-search</text>
  <text class="s" x="380" y="60">the operations</text>

  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M300,72 C300,92 120,90 120,108"/>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M380,72 L380,90 C380,100 335,96 335,108"/>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M460,72 C460,92 595,90 595,108"/>

  <!-- notes-cli-rust -->
  <rect class="panel" stroke="#d0d7de" x="20" y="110" width="200" height="240" rx="10"/>
  <text class="hc" x="120" y="134">notes-cli-rust</text>
  <rect class="rs" stroke="#cf222e" x="40" y="150" width="160" height="46" rx="6"/>
  <text class="t" x="120" y="170">add, list, remove,</text>
  <text class="t" x="120" y="186">search, docs in Rust</text>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M120,196 L120,288"/>
  <rect class="ext" stroke="#1a7f37" x="40" y="290" width="160" height="40" rx="6"/>
  <text class="tc" x="120" y="315">NotesCliExt</text>

  <!-- notes-cli-md -->
  <rect class="panel" stroke="#d0d7de" x="235" y="110" width="200" height="240" rx="10"/>
  <text class="hc" x="335" y="134">notes-cli-md</text>
  <rect class="md" stroke="#bf8700" x="255" y="150" width="160" height="46" rx="6"/>
  <text class="tc" x="335" y="170">src/cli.md</text>
  <text class="s" x="335" y="186">every command</text>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" d="M335,196 L335,230"/>
  <text class="lm" x="335" y="246">markdown_cli_src!</text>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M335,254 L335,288"/>
  <rect class="ext" stroke="#1a7f37" x="255" y="290" width="160" height="40" rx="6"/>
  <text class="tc" x="335" y="315">NotesCliExt</text>

  <!-- notes-cli-mixed -->
  <rect class="panel" stroke="#d0d7de" x="450" y="110" width="290" height="240" rx="10"/>
  <text class="hc" x="595" y="134">notes-cli-mixed</text>
  <rect class="rs" stroke="#cf222e" x="465" y="150" width="120" height="46" rx="6"/>
  <text class="t" x="525" y="170">add, list, remove</text>
  <text class="s" x="525" y="186">in Rust</text>
  <rect class="md" stroke="#bf8700" x="605" y="150" width="120" height="46" rx="6"/>
  <text class="t" x="665" y="170">search, docs</text>
  <text class="s" x="665" y="186">inline Markdown</text>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M665,196 L665,220"/>
  <text class="lc" x="658" y="212" text-anchor="end">markdown_cli!</text>
  <rect class="ext" stroke="#1a7f37" x="605" y="222" width="120" height="34" rx="6"/>
  <text class="tc" x="665" y="244">LookupCliExt</text>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M525,196 L525,288"/>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M665,256 L665,288"/>
  <text class="lbl" x="672" y="276">merge</text>
  <rect class="ext" stroke="#1a7f37" x="480" y="290" width="230" height="40" rx="6"/>
  <text class="tc" x="595" y="315">NotesCliExt</text>

  <!-- One spec -->
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M120,350 C120,385 300,375 318,398"/>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M335,350 C335,370 375,370 378,398"/>
  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M595,350 C595,385 460,375 442,398"/>
  <text class="lc" x="470" y="372">Describe</text>
  <rect class="spec" stroke="#0969da" x="300" y="400" width="160" height="40" rx="8"/>
  <text class="hc" x="380" y="425">CliSpec</text>

  <path class="edge" stroke="#59636e" stroke-width="1.4" fill="none" marker-end="url(#a)" d="M380,440 L380,478"/>
  <text class="lc" x="388" y="463">render</text>
  <rect class="md" stroke="#bf8700" x="250" y="480" width="260" height="52" rx="8"/>
  <text class="t" x="380" y="502">Markdown printed by docs</text>
  <text class="lm" x="380" y="520">notes-cli-md/src/cli.md</text>
</svg>
