[workspace]
resolver = "2"
members = ["notes", "notes-*", "crates/*"]
# The notes app, so `cargo run` runs it.
default-members = ["crates/notes-cli-md-direct"]

[workspace.package]
version = "0.1.0"
authors = ["ALUX Network <info@alux.network>"]
edition = "2024"
license = "MIT-0"
publish = false
rust-version = "1.97"

[workspace.dependencies]
notes = { path = "notes" }
notes-cli-describe = { path = "crates/notes-cli-describe" }
notes-cli-macro = { path = "crates/notes-cli-macro" }
notes-cli-markdown = { path = "crates/notes-cli-markdown" }
notes-cli-md = { path = "notes-cli-md" }
notes-cli-mixed = { path = "notes-cli-mixed" }
notes-cli-rust = { path = "notes-cli-rust" }
notes-cli-rust-direct = { path = "crates/notes-cli-rust-direct" }
notes-cli-rust-gen = { path = "crates/notes-cli-rust-gen" }
notes-conformance = { path = "crates/notes-conformance" }
notes-files = { path = "crates/notes-files" }
notes-memory = { path = "crates/notes-memory" }
notes-search = { path = "notes-search" }

# ALUX Design by Meaning infrastructure (https://github.com/alux-network/alux-rust).
alux-cli = "0.4"
alux-cli-direct = "0.4"
alux-ext = "0.3"

anyhow = "1"
proc-macro2 = "1"
quote = "1"
syn = "3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

